name: Cloud Torrent Downloader

on:
  workflow_dispatch:
    inputs:
      magnet_url:
        description: 'Magnet URL or Torrent Link'
        required: true
        type: string
      upload_to_direct:
        description: 'Generate high-speed direct download link (CDN)'
        required: false
        default: 'true'
        type: string
      upload_to_gdrive:
        description: 'Upload to Google Drive'
        required: false
        default: 'false'
        type: string
      destination_folder:
        description: 'Google Drive Destination Subfolder (inside /Torrents)'
        required: false
        default: 'General'
        type: string

jobs:
  download-and-distribute:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 curl jq zip
          sudo -v ; curl https://rclone.org/install.sh | sudo bash
          rclone version
          aria2c --version

      - name: Download Torrent via Aria2
        id: aria2_download
        run: |
          mkdir -p ./downloads
          echo "Starting high-speed cloud torrent download..."
          
          aria2c \
            --allow-overwrite=true \
            --auto-file-renaming=false \
            --seed-time=0 \
            --summary-interval=5 \
            --max-connection-per-server=16 \
            --bt-max-peers=120 \
            --bt-tracker-connect-timeout=10 \
            --bt-tracker-timeout=10 \
            --dir="./downloads" \
            "${{ inputs.magnet_url }}"
            
          echo "Download complete! Files downloaded:"
          ls -la ./downloads

      - name: Generate Direct High-Speed Download Link
        if: ${{ inputs.upload_to_direct == 'true' || inputs.upload_to_direct == true }}
        run: |
          FILE_COUNT=$(ls -1 ./downloads | wc -l)
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "No files downloaded to upload."
            exit 1
          fi

          if [ "$FILE_COUNT" -gt 1 ] || [ -d ./downloads/* ]; then
            echo "Packaging multi-file torrent into single archive..."
            cd ./downloads && zip -r -0 ../TorrentBundle.zip ./* && cd ..
            UPLOAD_FILE="TorrentBundle.zip"
          else
            SINGLE_FILE=$(ls -1 ./downloads | head -n 1)
            UPLOAD_FILE="./downloads/$SINGLE_FILE"
          fi

          echo "Target upload file: $UPLOAD_FILE"
          
          # Upload to GoFile CDN
          SERVER=$(curl -s https://api.gofile.io/servers | jq -r '.data.servers[0].name // "store-eu-par-4"')
          echo "Uploading to GoFile server: $SERVER ..."
          UPLOAD_RES=$(curl -s -F "file=@$UPLOAD_FILE" "https://${SERVER}.gofile.io/contents/uploadfile")
          DIRECT_URL=$(echo "$UPLOAD_RES" | jq -r '.data.downloadPage // empty')

          # Fallback to Pixeldrain if GoFile did not return a link
          if [ -z "$DIRECT_URL" ] || [ "$DIRECT_URL" = "null" ]; then
            echo "GoFile upload was empty. Uploading to Pixeldrain CDN fallback..."
            PIXEL_RES=$(curl -s -F "file=@$UPLOAD_FILE" https://pixeldrain.com/api/file)
            PIXEL_ID=$(echo "$PIXEL_RES" | jq -r '.id // empty')
            if [ -n "$PIXEL_ID" ]; then
              DIRECT_URL="https://pixeldrain.com/u/$PIXEL_ID"
            fi
          fi

          if [ -n "$DIRECT_URL" ]; then
            echo "=========================================================="
            echo "DIRECT_DOWNLOAD_URL: $DIRECT_URL"
            echo "=========================================================="
            echo "### 🚀 High-Speed Direct Download Link:" >> $GITHUB_STEP_SUMMARY
            echo "[Click to Download / Stream ($DIRECT_URL)]($DIRECT_URL)" >> $GITHUB_STEP_SUMMARY
          else
            echo "Notice: Could not generate public direct link."
          fi

      - name: Upload to Google Drive (Optional)
        if: ${{ inputs.upload_to_gdrive == 'true' || inputs.upload_to_gdrive == true }}
        env:
          RCLONE_CONF_BASE64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
        run: |
          if [ -z "$RCLONE_CONF_BASE64" ]; then
            echo "ERROR: RCLONE_CONFIG_BASE64 secret is missing in GitHub repository!"
            echo "Please configure Google Drive in your CloudTorrent dashboard."
            exit 1
          fi

          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONF_BASE64" | base64 --decode > ~/.config/rclone/rclone.conf

          DEST_FOLDER="${{ inputs.destination_folder }}"
          if [ -z "$DEST_FOLDER" ]; then
            DEST_FOLDER="General"
          fi

          echo "Uploading to Google Drive at: Torrents/$DEST_FOLDER"
          rclone copy ./downloads "gdrive:Torrents/$DEST_FOLDER" \
            --transfers=4 \
            --drive-chunk-size=64M \
            --stats=10s \
            --stats-one-line \
            -v

          echo "Google Drive transfer successfully completed!"
          echo "### 📁 Google Drive:" >> $GITHUB_STEP_SUMMARY
          echo "Files uploaded to \`Torrents/$DEST_FOLDER\`" >> $GITHUB_STEP_SUMMARY

      - name: Clean Up Scratch Files
        if: always()
        run: |
          rm -rf ./downloads TorrentBundle.zip
          rm -rf ~/.config/rclone/rclone.conf
          echo "Cleaned up all temporary files."
