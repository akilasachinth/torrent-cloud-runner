name: Deploy GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject GH_TOKEN into app.js
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          # Replace the __BAKED_TOKEN__ placeholder with the real token so new browsers
          # work without any manual PAT entry. Token lives only in the deployed JS.
          sed -i "s|__BAKED_TOKEN__|${GH_TOKEN}|g" public/app.js

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
