name: Cloud Torrent Downloader

on:
  workflow_dispatch:
    inputs:
      magnet_url:
        description: 'Magnet URL or Torrent Link'
        required: true
        type: string

permissions:
  contents: read

jobs:
  download-and-distribute:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 curl jq zip
          aria2c --version

      - name: Download Torrent via Aria2
        id: aria2_download
        env:
          MAGNET_URL: ${{ inputs.magnet_url }}
        run: |
          mkdir -p ./downloads
          echo "Starting high-speed cloud torrent download..."
          
          # Validate input
          if [[ ! "$MAGNET_URL" =~ ^(magnet:\?|https?:\/\/) ]]; then
            echo "ERROR: Invalid magnet link or torrent URL provided."
            exit 1
          fi
          
          aria2c \
            --allow-overwrite=true \
            --auto-file-renaming=false \
            --seed-time=0 \
            --summary-interval=5 \
            --max-connection-per-server=16 \
            --bt-max-peers=120 \
            --bt-tracker-connect-timeout=10 \
            --bt-tracker-timeout=10 \
            --dir="./downloads" \
            "$MAGNET_URL"
            
          echo "Download complete! Files downloaded:"
          ls -la ./downloads

      - name: Generate Direct High-Speed Download Link
        run: |
          FILE_COUNT=$(ls -1 ./downloads | wc -l)
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "No files downloaded to upload."
            exit 1
          fi

          # Determine the real torrent name (top-level entry in downloads/)
          RAW_NAME=$(ls -1 ./downloads | head -n 1)
          # Sanitize: keep alphanumeric, dots, spaces, underscores, hyphens (- placed at the end to prevent invalid range)
          SAFE_NAME=$(echo "$RAW_NAME" | tr -cd '[:alnum:]. _-')
          # Fallback if name is empty after sanitize
          if [ -z "$SAFE_NAME" ]; then
            SAFE_NAME="download"
          fi

          if [ "$FILE_COUNT" -gt 1 ] || [ -d "./downloads/$RAW_NAME" ]; then
            echo "Packaging multi-file torrent into single archive..."
            ZIP_NAME="${SAFE_NAME}.zip"
            (cd ./downloads && zip -q -r -0 "../${ZIP_NAME}" -- .)
            UPLOAD_FILE="${ZIP_NAME}"
            TORRENT_NAME="${ZIP_NAME}"
          else
            UPLOAD_FILE="./downloads/${RAW_NAME}"
            TORRENT_NAME="${RAW_NAME}"
          fi

          echo "Torrent name: $TORRENT_NAME"
          echo "Target upload file: $UPLOAD_FILE"
          
          # Upload to GoFile CDN (sanitize server name)
          SERVER=$(curl -s https://api.gofile.io/servers | jq -r '.data.servers[0].name // "store-eu-par-4"' | tr -cd '[:alnum:]-')
          if [ -z "$SERVER" ]; then
            SERVER="store-eu-par-4"
          fi
          echo "Uploading to GoFile server: $SERVER ..."
          UPLOAD_RES=$(curl -s -F "file=@${UPLOAD_FILE}" "https://${SERVER}.gofile.io/contents/uploadfile")
          DIRECT_URL=$(echo "$UPLOAD_RES" | jq -r '.data.downloadPage // empty')

          # Fallback to Pixeldrain if GoFile did not return a link
          if [ -z "$DIRECT_URL" ] || [ "$DIRECT_URL" = "null" ]; then
            echo "GoFile upload was empty. Uploading to Pixeldrain CDN fallback..."
            PIXEL_RES=$(curl -s -F "file=@${UPLOAD_FILE}" https://pixeldrain.com/api/file)
            PIXEL_ID=$(echo "$PIXEL_RES" | jq -r '.id // empty' | tr -cd '[:alnum:]-')
            if [ -n "$PIXEL_ID" ]; then
              DIRECT_URL="https://pixeldrain.com/api/file/$PIXEL_ID?download"
            fi
          fi

          # Strictly validate DIRECT_URL format
          if [[ "$DIRECT_URL" =~ ^https:\/\/[a-zA-Z0-9\.\-\_\/\?\=\&]+$ ]]; then
            echo "=========================================================="
            echo "DIRECT_DOWNLOAD_URL: $DIRECT_URL"
            echo "DOWNLOAD_FILENAME: $TORRENT_NAME"
            echo "=========================================================="
            echo "### 🚀 High-Speed Direct Download Link:" >> $GITHUB_STEP_SUMMARY
            echo "[${TORRENT_NAME} — Click to Download ($DIRECT_URL)]($DIRECT_URL)" >> $GITHUB_STEP_SUMMARY
          else
            echo "Notice: No valid direct link generated."
          fi

      - name: Clean Up Scratch Files
        if: always()
        run: |
          rm -rf ./downloads *.zip
          echo "Cleaned up all temporary files."
